<!-- Botón hamburguesa mobile -->
<button class="menu-toggle" (click)="toggleSidebar()" [attr.aria-label]="sidebarOpen() ? 'Cerrar menú' : 'Abrir menú'">
  {{ sidebarOpen() ? '✕' : '☰' }}
</button>

<!-- Overlay mobile -->
<div
  class="sidebar-overlay"
  [class.visible]="sidebarOpen()"
  (click)="closeSidebar()">
</div>

<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar" [class.open]="sidebarOpen()">

    <div class="brand">
      <small>ENGLISH ACADEMY</small>
      <h1>Grammar</h1>
      <p>Guía completa de gramática</p>
    </div>

    <nav class="nav-list">
      @for (topic of topics; track topic.id) {
        <app-topic-card
          [topic]="topic"
          [isActive]="isActive(topic)"
          (selected)="navigate($event)" />
      }
    </nav>

    <div class="sidebar-footer">
      Angular 19 · English B1
    </div>

  </aside>

  <!-- Contenido -->
  <main class="content">
    <router-outlet />
  </main>

</div>
