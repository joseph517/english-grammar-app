<div class="table-wrapper">
  <table>
    <thead>
      <tr>
        @for (header of data().headers; track $index) {
        <th>{{ header }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of data().rows; track $index) {
      <tr>
        @for (cell of row; track $index) {
        <td>{{ cell }}</td>
        }
      </tr>
      }
    </tbody>
  </table>
</div>
