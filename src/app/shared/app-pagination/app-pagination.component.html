<button
  class="pagination-button"
  (click)="onPageChange(currentPage() - 1)"
  [disabled]="currentPage() === 1">
  ← Previous
</button>

<span class="pagination-info">
  Page <strong>{{ currentPage() }}</strong> of <strong>{{ totalPages() }}</strong>
</span>

<button
  class="pagination-button"
  (click)="onPageChange(currentPage() + 1)"
  [disabled]="currentPage() === totalPages()">
  Next →
</button>
